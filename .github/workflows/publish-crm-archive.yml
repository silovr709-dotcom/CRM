# Собрать скачиваемый ZIP сайта и прикрепить его к отдельному тестовому релизу.
# На хостинг ничего не загружает; база и файлы клиентов в архив не включаются.
name: CRM — тестовый архив для REG.RU

on:
  # Первый запуск с рабочей ветки создаёт архив для текущей задачи.
  push:
    branches:
      - arena/c931d8fc-crm
    paths:
      - '.github/workflows/publish-crm-archive.yml'
  # После попадания workflow в main владелец может выпустить новый архив вручную.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Проверить, собрать и опубликовать архив
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm-schedule/package-lock.json

      - name: Установить зависимости
        working-directory: crm-schedule
        run: npm ci

      - name: Проверить CRM
        working-directory: crm-schedule
        run: npm test

      - name: Собрать CRM
        working-directory: crm-schedule
        run: npm run build

      - name: Упаковать и проверить ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd crm-schedule/dist
          zip -qr "$RUNNER_TEMP/CRM-REG-RU-test.zip" .
          python3 - "$RUNNER_TEMP/CRM-REG-RU-test.zip" <<'PY'
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as archive:
              names = set(archive.namelist())
              assert archive.testzip() is None, 'Ошибка проверки ZIP'
              assert {'index.html', 'sw.js', 'manifest.webmanifest'} <= names, 'Нет файлов в корне ZIP'
              assert any(name.startswith('assets/') for name in names), 'Нет собранных ресурсов'
              assert not any(name.startswith(('dist/', 'node_modules/', '.git/')) for name in names)
              print('Архив проверен: index.html в корне, файлы на месте')
          PY

      - name: Опубликовать архив в GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="crm-reg-ru-test-${GITHUB_RUN_ID}"
          gh release create "$tag" "$RUNNER_TEMP/CRM-REG-RU-test.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title 'Тестовая сборка CRM для REG.RU' \
            --notes 'Готовая тестовая сборка сайта: index.html находится в корне ZIP. Архив не содержит базу клиентов или вложения. На хостинг автоматически не загружается.'
